services:
  - type: web
    name: forensic-elimination
    runtime: python
    plan: free
    rootDir: forensic_elimination
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FE_HOST_PASSWORD
        sync: false

  # Fraud Files: 2-Day Challenge (two rounds on two days). Its scores are
  # kept overnight in the free database below.
  - type: web
    name: fraud-files-2day
    runtime: python
    plan: free
    rootDir: fraud_files_2day
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --graceful-timeout 20
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FE_HOST_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: fraud-files-2day-db
          property: connectionString

databases:
  - name: fraud-files-2day-db
    plan: free
