<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}Forensic Elimination{% endblock %}
    </title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Rajdhani:wght@500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='elimination.css') }}"
    >

    <script src="{{ url_for('static', filename='elimination-sfx.js') }}"></script>

</head>

<body class="fe-body">

    <div class="fe-app">

        {% block top_header %}
        <header class="fe-topbar-simple">
            <a href="{{ url_for('elimination.home') }}" class="fe-brand">
                <img class="fe-brand-mark" src="{{ url_for('static', filename='images/brand-icon.webp') }}" alt="">
                <span class="fe-brand-text">
                    FORENSIC<br>ELIMINATION
                </span>
            </a>
        </header>
        {% endblock %}

        <main class="fe-main">
            {% block content %}{% endblock %}
        </main>

        <nav class="fe-bottomnav">
            <a href="{{ url_for('elimination.home') }}" class="{{ 'active' if active_nav == 'home' else '' }}">
                <span class="fe-nav-icon">&#8962;</span>
                <span>HOME</span>
            </a>
            <a href="{{ url_for('elimination.join') }}" class="{{ 'active' if active_nav == 'play' else '' }}">
                <span class="fe-nav-icon">&#10067;</span>
                <span>PLAY</span>
            </a>
            <a href="{{ url_for('elimination.leaderboard') }}" class="{{ 'active' if active_nav == 'leaderboard' else '' }}">
                <span class="fe-nav-icon">&#9650;</span>
                <span>LEADERBOARD</span>
            </a>
            <a href="{{ url_for('elimination.case_files') }}" class="{{ 'active' if active_nav == 'case_files' else '' }}">
                <span class="fe-nav-icon">&#9635;</span>
                <span>CASE FILES</span>
            </a>
            <a href="{{ url_for('elimination.rules') }}" class="{{ 'active' if active_nav == 'rules' else '' }}">
                <span class="fe-nav-icon">&#127942;</span>
                <span>RULES</span>
            </a>
            <a href="{{ url_for('elimination.settings') }}" class="{{ 'active' if active_nav == 'settings' else '' }}">
                <span class="fe-nav-icon">&#9881;</span>
                <span>SETTINGS</span>
            </a>
        </nav>

    </div>

</body>

</html>
