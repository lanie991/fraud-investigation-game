{% if can_feedback %}
<div class="fe-card fe-rate" id="fe-rate" data-url="{{ url_for('elimination.feedback_submit', name=name) }}">
    {% if feedback_given %}
    <div class="fe-rate-done">&#10003; Thanks for your feedback!</div>
    {% else %}
    <h2>HOW DID YOU ENJOY FRAUD FILES?</h2>
    <div class="fe-rate-stars" role="radiogroup" aria-label="Rating out of 5">
        {% for n in range(1, 6) %}
        <button type="button" class="fe-rate-star" data-value="{{ n }}" aria-label="{{ n }} star{{ 's' if n > 1 else '' }}">&#9733;</button>
        {% endfor %}
    </div>
    <textarea id="fe-rate-comment" maxlength="500" rows="3" placeholder="Anything you'd like to tell us? (optional)"></textarea>
    <button type="button" class="fe-btn fe-btn-gold fe-btn-block" id="fe-rate-send" disabled>SEND FEEDBACK</button>
    <div class="fe-rate-done" id="fe-rate-thanks" hidden>&#10003; Thanks for your feedback!</div>
    {% endif %}
</div>
<script>
(function () {
    const box = document.getElementById("fe-rate");
    const send = document.getElementById("fe-rate-send");
    if (!box || !send) return;
    const stars = Array.prototype.slice.call(box.querySelectorAll(".fe-rate-star"));
    let rating = 0;
    stars.forEach(function (star) {
        star.addEventListener("click", function () {
            rating = Number(star.dataset.value);
            stars.forEach(function (s) { s.classList.toggle("on", Number(s.dataset.value) <= rating); });
            send.disabled = false;
        });
    });
    send.addEventListener("click", function () {
        send.disabled = true;
        const body = new URLSearchParams({ rating: String(rating), comment: document.getElementById("fe-rate-comment").value });
        fetch(box.dataset.url, { method: "POST", body: body })
            .then(function (r) { if (!r.ok) throw new Error(); })
            .then(function () {
                box.querySelectorAll("h2, .fe-rate-stars, textarea, #fe-rate-send").forEach(function (el) { el.hidden = true; });
                document.getElementById("fe-rate-thanks").hidden = false;
            })
            .catch(function () { send.disabled = false; });
    });
})();
</script>
{% endif %}
